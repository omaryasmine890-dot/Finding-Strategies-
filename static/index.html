<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Sweep Studio</title>
<style>
:root{--bg:#0a0b11;--card:#0e0f18;--bd:#23253a;--tx:#e8e8f0;--mut:#8b8da6;--pp:#7c3aed;--c1:#22d3ee;--c2:#22c55e;--r:#ef4444}
*{box-sizing:border-box}body{margin:auto;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,sans-serif;padding:10px;max-width:760px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:20px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mono{font-family:ui-monospace,Consolas,monospace}.mut{color:var(--mut)}.g{color:var(--c2)}.r{color:var(--r)}
.logo{width:42px;height:42px;border-radius:12px;background:var(--pp);display:grid;place-items:center;font-weight:bold;font-size:20px}
.pill{border:1px solid var(--pp);color:#a78bfa;border-radius:20px;padding:2px 10px;font-size:11px;font-family:monospace}
small{color:var(--mut);font-size:12px;display:block}
button{background:var(--pp);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
button.ic{background:transparent;border:1px solid var(--bd);font-size:18px}button.ghost{background:transparent;color:var(--mut);font-size:13px;padding:4px 8px}
.chip{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:13px;font-family:monospace}
canvas{width:100%;display:block}#cv{height:300px}
.lr{display:flex;justify-content:space-between;margin-top:8px;font-family:monospace;font-size:15px}
.buy{background:var(--c2);padding:4px 12px;border-radius:8px;font-weight:bold}.sell{background:var(--r);padding:4px 12px;border-radius:8px;font-weight:bold}
.pt{display:grid;grid-template-columns:1.6fr 1fr 1fr;padding:12px 14px;border-top:1px solid var(--bd);align-items:center}
.pt.h{background:#1d1640;border:0;font-weight:bold}.pt>*:nth-child(2){text-align:center}.pt>*:nth-child(3){text-align:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:26px;font-family:monospace;direction:ltr;text-align:start;margin-top:6px}
.lg{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);font-family:monospace}
.sc{border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.sc .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:5px}
input,select{background:#080910;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:15px;width:100%;font-family:monospace;text-align:center}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pp)}
select{text-align:start;font-family:inherit}
</style></head><body>
<div class="card"><div class="row"><div class="row" style="justify-content:flex-start;gap:10px"><div class="logo">S</div>
<div><b style="font-size:17px">Daily Sweep Studio</b> <span class="pill">Crypto</span><small>سحب السيولة على مستويات الشمعة اليومية</small></div></div>
<div class="row"><span class="chip" id="chip">—</span><button class="ic" id="rst" title="تصفير">↻</button><button id="pause">⏸ إيقاف مؤقت</button></div></div>
<div id="err" class="r" style="font-size:13px;margin-top:8px"></div></div>

<div class="card"><div class="lr" style="margin-top:0"><span id="px" style="font-size:24px">—</span><span class="mut" id="ri"></span></div>
<canvas id="cv"></canvas></div>
<div class="mono mut" style="font-size:13px;margin:0 4px 6px" id="sl"></div>

<h2>الصفقة المفتوحة حاليا</h2><div class="card" id="open"></div>

<h2>جدول الأداء وإحصائيات الاستراتيجية</h2>
<div class="card" style="padding:0;overflow:hidden" id="pine"></div>
<div class="two"><div class="card"><small>معدل النجاح (Win Rate)</small><div class="big" id="wr">—</div></div>
<div class="card"><small>إجمالي الربح (%)</small><div class="big g" id="pts">0</div></div></div>

<h2>سجل أحدث الصفقات <small id="cn"></small></h2><div class="card" id="log"></div>

<h2>الإعدادات <button class="ghost" id="def">افتراضي</button></h2>
<div id="set"></div>
<div class="card"><div class="f"><label>كلمة المرور (إن وُجدت)<input type="password" id="pw"></label><label>&nbsp;<button id="save">حفظ الإعدادات</button></label></div>
<div id="msg" style="margin-top:8px;font-size:13px"></div></div>

<h2>اختبار الاستراتيجية (Backtest)</h2>
<div class="card">
  <div class="f">
    <label>الفترة والفريم
      <select id="bt_mode">
        <option value="15|30">شهر كامل · فريم 15 دقيقة</option>
        <option value="15|14">أسبوعان · فريم 15 دقيقة</option>
        <option value="5|14">أسبوعان · فريم 5 دقائق</option>
        <option value="5|7">أسبوع · فريم 5 دقائق</option>
      </select>
    </label>
    <label>&nbsp;<button id="bt_btn">ابدأ الاختبار</button></label>
  </div>
  <div id="backtest-results" style="margin-top:10px;font-size:14px;line-height:1.9"></div>
</div>

<script>
const $=i=>document.getElementById(i);
const DEF={exchange:'bybit',symbol:'BTCUSDT',tf:'15',sl_buf:0.05,be_on:1,once:1,chop_on:1,chop_n:24,chop_x:4};
const S=[
{t:'المنصة والرمز',f:[['exchange','المنصة','sel:bybit,binance'],['symbol','الرمز'],['tf','الفريم (دقائق)','sel:1,3,5,15,30']]},
{t:'الوقف',f:[['sl_buf','هامش الوقف خلف السحب (%)','','var(--r)']]},
{t:'نقل الوقف إلى الدخول بعد TP1',on:'be_on',f:[]},
{t:'صفقة واحدة لكل اتجاه في اليوم',on:'once',f:[]},
{t:'فلتر التذبذب حول 50%',on:'chop_on',f:[['chop_n','عدد الشموع المفحوصة'],['chop_x','أقل عدد تقاطعات للمنع']]}];
const KEYS=S.flatMap(s=>[...(s.on?[s.on]:[]),...s.f.map(f=>f[0])]);
$('set').innerHTML=S.map(s=>`<div class="sc"><div class="t"><span>${s.t}</span>${s.on?`<input type="checkbox" id="f_${s.on}">`:''}</div>${s.f.length?'<div class="f">':''}`+
 s.f.map(([k,t,x,c])=>x&&x.startsWith('sel:')?`<label>${t}<select id="f_${k}">${x.slice(4).split(',').map(o=>`<option value="${o}">${o}</option>`).join('')}</select></label>`
 :`<label>${t}<input id="f_${k}" inputmode="decimal" ${c?`style="color:${c}"`:''}></label>`).join('')+`${s.f.length?'</div>':''}</div>`).join('');
function fill(c){KEYS.forEach(k=>{const e=$('f_'+k);const v=c[k]??DEF[k];if(e.type==='checkbox')e.checked=!!v;else e.value=v})}
let filled=false;
async function api(url,body={}){try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value,...body})});
 const j=await r.json();$('msg').style.color=r.ok?'#22c55e':'#ef4444';$('msg').textContent=r.ok?'تم الحفظ والتطبيق ✓':(j.error||'خطأ');$('msg').scrollIntoView({block:'center'});return r.ok?j:null}catch(e){$('msg').textContent='خطأ اتصال';return null}}
$('save').onclick=async()=>{const cfg={};KEYS.forEach(k=>{const e=$('f_'+k);cfg[k]=e.type==='checkbox'?(e.checked?1:0):e.value});if(await api('/api/config',{cfg}))filled=false};
$('def').onclick=()=>fill(DEF);
$('rst').onclick=()=>confirm('تصفير الصفقات والإحصائيات؟')&&api('/api/reset');
$('pause').onclick=()=>api('/api/pause');

function draw(d){
 const cs=d.candles,n=cs.length;if(!n)return;
 const cv=$('cv'),dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
 const g=cv.getContext('2d');g.scale(dpr,dpr);const lv=d.levels,t=d.trade;
 let hi=Math.max(...cs.map(x=>x.h)),lo=Math.min(...cs.map(x=>x.l));
 if(lv){hi=Math.max(hi,lv.h);lo=Math.min(lo,lv.l)}
 const Y=v=>h-8-(v-lo)/(hi-lo||1)*(h-16),cw=w/n;
 cs.forEach((c,i)=>{const x=i*cw+cw/2;g.strokeStyle=g.fillStyle=c.c>=c.o?'#22c55e':'#ef4444';g.lineWidth=1;
  g.beginPath();g.moveTo(x,Y(c.h));g.lineTo(x,Y(c.l));g.stroke();g.fillRect(x-cw*.35,Math.min(Y(c.o),Y(c.c)),cw*.7,Math.max(1,Math.abs(Y(c.o)-Y(c.c))))});
 const line=(v,col,dash,txt)=>{if(v<lo||v>hi)return;g.strokeStyle=col;g.lineWidth=1;g.setLineDash(dash);g.beginPath();g.moveTo(0,Y(v));g.lineTo(w,Y(v));g.stroke();g.setLineDash([]);
  if(txt){g.fillStyle=col;g.font='11px monospace';g.fillText(txt,4,Y(v)-3)}};
 if(lv){line(lv.h,'#ef4444',[],'قمة أمس');line(lv.m,'#e8e8f0',[5,4],'50%');line(lv.l,'#22c55e',[],'قاع أمس')}
 if(t){line(t.e,'#ffffff',[2,3]);line(t.sl,'#f97316',[5,4]);line(t.tp1,'#22d3ee',[5,4]);line(t.tp2,'#a78bfa',[5,4])}}

const NOTE={SL:'SL (خسارة)',TP1_STOP:'TP1 ثم وقف',TP2:'TP2 (ربح كامل)'};
const tpRow=(l,v,hit,c)=>`<div class="lr"><span style="color:${c}">${l}</span><span>${hit?'✓ ':''}${v.toFixed(2)}</span></div>`;
async function tick(){
 try{const d=await (await fetch('/api/state')).json(),c=d.cfg,s=d.stats;
  if(!filled){fill(c);filled=true}
  $('err').textContent=d.error?'خطأ: '+d.error:'';
  $('chip').textContent=`${c.symbol} · ${d.src||c.exchange} · ${c.tf}m`;
  $('pause').textContent=d.paused?'▶ استئناف':'⏸ إيقاف مؤقت';
  const st={running:'نشط',paused:'متوقف مؤقتًا',error:'خطأ',starting:'يبدأ…'}[d.status]||d.status;
  const lv=d.levels;
  $('sl').textContent=`الحالة: ${st}`+(lv?` | قمة أمس ${lv.h} | 50% ${lv.m.toFixed(2)} | قاع أمس ${lv.l}`:'');
  if(d.price!=null){$('px').textContent=d.price;$('ri').textContent=lv?(d.price>lv.m?'فوق 50%':'تحت 50%'):'';draw(d)}
  const t=d.trade;
  $('open').innerHTML=!t?'<span class="mut">لا توجد صفقة مفتوحة</span>':
   `<div class="row"><span class="${t.side==='BUY'?'buy':'sell'}">${t.side} #${t.no} ${t.side==='BUY'?'شراء':'بيع'}</span><span class="mono mut">سعر الدخول: ${t.e}</span></div>`+
   tpRow('وقف الخسارة (SL):',t.sl,0,'#f97316')+tpRow('هدف 1 (50%):',t.tp1,t.stage>=1,'var(--c1)')+tpRow('هدف 2 (طرف المدى):',t.tp2,0,'#a78bfa');
  const pc=v=>s.n?Math.round(v/s.n*100)+'%':'0%';
  const rows=[['TP1 (وصل 50%)',s.tp1,'var(--c1)'],['TP2 (الهدف الثاني)',s.tp2,'#a78bfa'],['TP1 ثم وقف',s.stop1,'#f59e0b'],['SL (وقف الخسارة)',s.sl,'var(--r)']];
  $('pine').innerHTML=`<div class="pt h"><span>SWEEP ●</span><span>الصفقات</span><span>النسبة</span></div>`+
   rows.map(([a,v,col])=>`<div class="pt mono"><span style="color:${col}">${a}</span><span>${v}</span><span style="color:${col}">${pc(v)}</span></div>`).join('')+
   `<div class="pt" style="background:#14142a"><span><b>إجمالي الصفقات</b></span><span style="color:#a78bfa" class="mono">${s.n}</span><span class="mut">-</span></div>`;
  $('wr').textContent=s.win==null?'—':s.win.toFixed(1)+'%';
  $('pts').textContent=(s.pnl>=0?'+':'')+s.pnl.toFixed(2)+'%';$('pts').className='big '+(s.pnl>=0?'g':'r');
  $('cn').textContent=`${s.n} صفقة مغلقة · ${s.r>=0?'+':''}${s.r}R`;
  $('log').innerHTML=d.log.length?d.log.map(l=>{const w=l.pnl>0;return`<div class="lg"><span><b class="${l.side==='BUY'?'g':'r'}">${l.side}</b> <span class="mut">#${l.no}</span> @ ${l.e}</span><span style="text-align:end;direction:ltr"><div class="${w?'g':'r'}">${w?'+':''}${l.pnl.toFixed(2)}%</div><small>${NOTE[l.outcome]||l.outcome}</small></span></div>`}).join(''):'<span class="mut">لا توجد صفقات مغلقة بعد</span>';
 }catch(e){$('err').textContent='انقطع الاتصال بالسيرفر'}}
tick();setInterval(tick,3000);

async function startBacktest(){
 const box=$('backtest-results'),btn=$('bt_btn');
 const [interval,days]=$('bt_mode').value.split('|');
 box.style.color='';box.innerText='جاري إجراء المحاكاة... (قد تستغرق حتى دقيقة)';
 btn.disabled=true;
 try{
  const r=await fetch('/api/backtest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({interval:interval,days:+days})});
  const data=await r.json();
  if(data.error){box.style.color='#ef4444';box.innerText='خطأ: '+data.error;return}
  box.innerHTML=`
   <div>📊 إجمالي الصفقات: <b>${data.total_trades}</b></div>
   <div style="color:#22d3ee">✓ وصلت TP1 (50%): ${data.tp1_hits}</div>
   <div style="color:#a78bfa">✓ رابحة كاملة (TP2): ${data.tp2_wins}</div>
   <div style="color:#f59e0b">↩ TP1 ثم وقف: ${data.tp1_stop}</div>
   <div style="color:#ef4444">✗ خاسرة قبل TP1: ${data.sl_losses}</div>
   <div>🎯 نسبة النجاح: <b>${data.win_rate}%</b></div>
   <div>💰 إجمالي الربح: <b class="${data.total_pct>=0?'g':'r'}">${data.total_pct}%</b> (${data.total_r}R)</div>
   <small>المصدر: ${data.src} · ${data.candles} شمعة · ${data.days_used} يوم</small>`;
 }catch(e){
  box.style.color='#ef4444';box.innerText='فشل الاتصال: '+e.message;
 }finally{
  btn.disabled=false;
 }
}
$('bt_btn').onclick=startBacktest;
</script>
</body></html>
